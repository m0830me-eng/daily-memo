name: Megabox Connection Test

on:
  workflow_dispatch:

jobs:
  connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run connection diagnostic
        run: |
          python -u megabox_connection_test.py
