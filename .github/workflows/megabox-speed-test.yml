name: Megabox COEX Speed Test

on:
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 30 minute speed test
        env:
          RUN_SECONDS: 1800
        run: |
          python -u megabox_coex_speed_test.py
